name: Release

# Publishes a signed APK as a GitHub Release that the in-app updater reads.
# This is a DELIBERATE act — it runs only on a version tag (v*) or a manual
# dispatch, never on an ordinary push — so day-to-day commits don't ship an
# update to the household. The normal push build (android.yml) is unchanged.
#
# To cut a release: bump versionCode / versionName (app/build.gradle.kts) and
# CLIENT_BUILD, update CHANGELOG.md, commit, then either push a tag
# `git tag v0.126.0 && git push origin v0.126.0`, or run this workflow manually.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add the four signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kairos-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kairos-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Assemble release metadata
        id: meta
        run: |
          set -euo pipefail
          VCODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1 || true)
          VNAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 || true)
          if [ -z "$VCODE" ] || [ -z "$VNAME" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"

          # Release tag: the pushed tag, or v<versionName> for a manual run.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VNAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Release notes: the top section of CHANGELOG.md (the newest entry).
          awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Update to $VNAME." > notes.md

          # The APK the app downloads, named predictably.
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::No release APK found"; exit 1; fi
          cp "$APK" "kairos-$VNAME.apk"

          # The manifest the app reads to decide whether to offer an update.
          jq -n --argjson vc "$VCODE" --arg vn "$VNAME" --rawfile notes notes.md \
            '{versionCode:$vc, versionName:$vn, notes:$notes}' > latest.json
          echo "latest.json:"; cat latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VNAME="${{ steps.meta.outputs.vname }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for an existing tag: refresh the assets in place.
            gh release upload "$TAG" "kairos-$VNAME.apk" latest.json --clobber
          else
            gh release create "$TAG" \
              --title "Kairos $VNAME" \
              --notes-file notes.md \
              "kairos-$VNAME.apk" latest.json
          fi
