name: Generate signing keystore (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and secrets file
        run: |
          set -euo pipefail
          ALIAS=kairos
          # PKCS12 (keytool's default) does NOT support a separate key password,
          # so store and key MUST share one password. Use a single value for both.
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)

          keytool -genkeypair -v \
            -keystore kairos-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Kairos, OU=Kairos, O=Kairos, L=City, ST=State, C=US"

          B64=$(base64 -w0 kairos-release.jks)
          {
            echo "Create these repository secrets:"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo
            echo "KEY_ALIAS"
            echo "$ALIAS"
            echo
            echo "KEYSTORE_PASSWORD  (use this SAME value for KEY_PASSWORD too)"
            echo "$PASS"
            echo
            echo "KEY_PASSWORD  (same value as KEYSTORE_PASSWORD above)"
            echo "$PASS"
            echo
            echo "KEYSTORE_BASE64  (paste this entire single line)"
            echo "$B64"
          } > signing-secrets.txt

      - name: Upload secrets file
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: signing-secrets.txt
          if-no-files-found: error
